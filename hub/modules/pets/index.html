<div class="pets-module dv-page">
  <div class="pets-module__columns">
    <section class="pets-module__pet">
      <p class="dv-kicker" data-i18n="tabYourCompanion">Your companion</p>
      <div class="pets-scene">
        <div class="pets-scene__ground"></div>
        <div class="pets-sprite" data-pets="pet">
          <div class="pet-motion"><div class="pet-body"><div class="pet-sprite" data-pets="sprite"></div></div></div>
        </div>
      </div>
      <h2 class="pets-name dv-heading dv-heading--small" data-pets="name">&nbsp;</h2>
      <p class="pets-stage" data-pets="stage"></p>
      <div class="pets-needs" data-pets="needs">
        <div class="pets-need dv-stat" data-pets="need-warmth"><span class="dv-stat__label" data-i18n="warmth">Warmth</span><b class="dv-stat__value" data-pets="num-warmth"></b><span class="dv-stat__bar"><i data-pets="bar-warmth"></i></span></div>
        <div class="pets-need dv-stat" data-pets="need-food"><span class="dv-stat__label" data-i18n="food">Food</span><b class="dv-stat__value" data-pets="num-food"></b><span class="dv-stat__bar"><i data-pets="bar-food"></i></span></div>
        <div class="pets-need dv-stat" data-pets="need-happiness"><span class="dv-stat__label" data-i18n="happiness">Happiness</span><b class="dv-stat__value" data-pets="num-happiness"></b><span class="dv-stat__bar"><i data-pets="bar-happiness"></i></span></div>
      </div>
      <div class="pets-actions">
        <button type="button" class="dv-button" data-pets="feed" data-i18n="feed">Feed</button>
        <button type="button" class="dv-button" data-pets="play" data-i18n="play">Play</button>
      </div>
      <p class="pets-result pets-note" data-pets="result"></p>
    </section>
    <section class="pets-module__about">
      <p class="dv-kicker" data-i18n="tabAbout">About</p>
      <dl class="pets-facts" data-pets="facts"></dl>
      <p class="dv-kicker pets-module__picker-kicker" data-i18n="tabCompanions">Companions</p>
      <p class="pets-note" data-pets="picker-note"></p>
      <button type="button" class="dv-button pets-picker-toggle" data-pets="picker-toggle" data-i18n="tabChangeCompanion" hidden>Change HUD companion</button>
      <div class="pets-picker" data-pets="picker"></div>
      <p class="pets-picker-current" data-pets="picker-current"></p>
    </section>
  </div>
</div>
